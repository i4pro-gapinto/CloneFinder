<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <div class="container topo__conteudo">
            <div class="topo__marca">
                <span class="topo__logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3"/>
                        <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
                        <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
                    </svg>
                </span>
                <div>
                    <h1 class="topo__titulo">Clone Finder</h1>
                    <p class="topo__subtitulo">Localize o servidor de cada cliente e abra o i4proclone</p>
                </div>
            </div>
            <div class="topo__acoes">
                <button type="button" id="botao-adicionar" class="botao botao--clonar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14"/><path d="M5 12h14"/>
                    </svg>
                    Adicionar cliente
                </button>
            </div>
        </div>
    </header>

    <dialog id="dialogo-cliente" class="dialogo" aria-labelledby="dialogo-titulo">
        <form id="form-cliente" class="dialogo__form" novalidate>
            <h2 id="dialogo-titulo" class="dialogo__titulo">Adicionar cliente</h2>

            <label class="campo">
                <span class="campo__rotulo">Cliente</span>
                <input type="text" id="campo-cliente" name="cliente" autocomplete="off" required
                       pattern="[A-Za-z0-9_\-]+" placeholder="Ex.: acme">
                <span class="campo__ajuda">Apenas letras, números, "_" e "-".</span>
            </label>

            <label class="campo">
                <span class="campo__rotulo">Banco de dados</span>
                <input type="text" id="campo-banco" name="banco" autocomplete="off" required
                       pattern="[A-Za-z0-9_\-]+" placeholder="Ex.: acme_erp_head">
            </label>

            <label class="campo">
                <span class="campo__rotulo">Servidor</span>
                <select id="campo-servidor" name="servidor" required>
                    <option value="">Selecione...</option>
                </select>
            </label>

            <p class="dialogo__erro" id="erro-cliente" role="alert" hidden></p>

            <div class="dialogo__acoes">
                <button type="button" id="botao-cancelar" class="botao botao--neutro">Cancelar</button>
                <button type="submit" class="botao botao--head">Salvar</button>
            </div>
        </form>
    </dialog>

    <main class="container">

        <section class="busca" aria-label="Pesquisa">
            <label for="campo-busca" class="busca__rotulo">Pesquisar por cliente ou servidor</label>
            <div class="busca__campo">
                <svg class="busca__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="search" id="campo-busca" placeholder="Ex.: itau ou wolverine" autocomplete="off" autofocus>
                <button type="button" id="botao-limpar" class="busca__limpar" aria-label="Limpar pesquisa" hidden>&times;</button>
            </div>
            <p class="busca__resumo" id="resumo" aria-live="polite"></p>
        </section>

        <section class="tabela-wrapper" aria-label="Lista de clientes">
            <table class="tabela">
                <thead>
                    <tr>
                        <th scope="col">Cliente</th>
                        <th scope="col">Banco de dados</th>
                        <th scope="col">Servidor</th>
                        <th scope="col" class="tabela__acao">Clone</th>
                        <th scope="col" class="tabela__acao">Head</th>
                    </tr>
                </thead>
                <tbody id="lista-clientes">
                    <tr class="estado">
                        <td colspan="5">Carregando clientes...</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <footer class="rodape">
        <div class="container">
            <span>Desenvolvido por <code>CláudioCode</code></span>
        </div>
    </footer>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="data/clientes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
